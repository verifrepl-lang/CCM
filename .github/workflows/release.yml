name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Версия релиза (например 1.0.6)"
        required: false
        default: ""

permissions:
  contents: write

env:
  GRADLE_VERSION: "8.9"
  NDK_VERSION: "27.0.12077973"
  CMAKE_VERSION: "3.22.1"

jobs:
  # ------------------------------------------------------------------ rootfs
  rootfs:
    name: Debian rootfs (${{ matrix.arch }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
          - arch: x86_64
            runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build rootfs tarball
        run: |
          chmod +x scripts/build-rootfs.sh
          mkdir -p dist
          scripts/build-rootfs.sh "${{ matrix.arch }}" "dist/rootfs-debian-bookworm-${{ matrix.arch }}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: rootfs-${{ matrix.arch }}
          path: dist/rootfs-debian-bookworm-*.tar.gz
          retention-days: 5

  # ------------------------------------------------------------------ proot
  proot:
    name: PRoot binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch PRoot + libtalloc (pinned Termux artifacts)
        run: |
          chmod +x scripts/fetch-proot.sh
          scripts/fetch-proot.sh aarch64 app/src/main/jniLibs
          scripts/fetch-proot.sh x86_64 app/src/main/jniLibs
          find app/src/main/jniLibs -type f | sort

      - uses: actions/upload-artifact@v4
        with:
          name: proot-jnilibs
          path: app/src/main/jniLibs/
          retention-days: 5

  # ------------------------------------------------------------------ apk
  apk:
    name: Release APK
    needs: [proot]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK (cmdline-tools)
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components (NDK, CMake)
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}" > /dev/null

      - name: Restore signing keystore (optional, from secrets)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          cat > keystore.properties <<EOF
          storeFile=$PWD/release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "keystore.properties created from secrets"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Download PRoot jniLibs
        uses: actions/download-artifact@v4
        with:
          name: proot-jnilibs
          path: app/src/main/jniLibs

      - name: License audit (PRoot GPL notice)
        run: |
          if [ -f scripts/licenses/PROOT_COPYRIGHT ]; then
            echo "PRoot license notice present:"; head -5 scripts/licenses/PROOT_COPYRIGHT
          else
            echo "::warning::PROOT_COPYRIGHT notice missing (fetch-proot.sh step)"
          fi

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Assemble release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Prepare release artifacts
        run: |
          mkdir -p dist
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$APK" "dist/CrabCodeMobile-${GITHUB_REF_NAME:-manual}.apk"
          sha256sum "dist/CrabCodeMobile-${GITHUB_REF_NAME:-manual}.apk" | awk '{print $1}' > "dist/CrabCodeMobile-${GITHUB_REF_NAME:-manual}.apk.sha256"
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: dist/
          retention-days: 5

  # ------------------------------------------------------------------ publish
  publish:
    name: GitHub Release
    needs: [apk, rootfs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-dl

      - name: Compose release directory
        run: |
          mkdir -p release
          find dist-dl -name '*.apk'        -exec cp {} release/ \;
          find dist-dl -name '*.apk.sha256' -exec cp {} release/ \;
          find dist-dl -name 'rootfs-*.tar.gz' -exec cp {} release/ \;

          VERSION="${GITHUB_REF_NAME:-v${{ inputs.version }}}"
          VERSION="${VERSION#v}"
          chmod +x scripts/make-env-manifest.sh
          scripts/make-env-manifest.sh "$VERSION" release/env-manifest.json \
            release/rootfs-debian-bookworm-aarch64.tar.gz \
            release/rootfs-debian-bookworm-x86_64.tar.gz

          cat > release/RELEASE_NOTES.md <<NOTES
          # Crab-Code-IDE Mobile $VERSION

          **Скачать**: \`CrabCodeMobile-v$VERSION.apk\` (подпись debug-ключом CI; для собственной подписи см. README).

          ## Артефакты окружения
          - \`rootfs-debian-bookworm-aarch64.tar.gz\` — Debian 12 для arm64 (телефоны/планшеты)
          - \`rootfs-debian-bookworm-x86_64.tar.gz\` — Debian 12 для x86_64 (эмуляторы)
          - \`env-manifest.json\` — манифест OTA-установки окружения (SHA-256)

          Приложение само скачивает нужный rootfs при первом запуске — вручную ничего устанавливать не нужно.

          ## Изменения
          Полный список — в коммитах с прошлого тега.
          NOTES
          ls -lh release/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -z "$TAG" ] || [ "$TAG" = "manual" ]; then TAG="v${{ inputs.version }}"; fi
          gh release create "$TAG" release/* \
            --title "Crab-Code-IDE Mobile ${TAG#v}" \
            --notes-file release/RELEASE_NOTES.md \
            --draft=false
